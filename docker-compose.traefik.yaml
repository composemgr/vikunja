name: vikunja
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: vikunja/vikunja:latest
    container_name: vikunja-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: vikunja-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      VIKUNJA_SERVICE_PUBLICURL: http://${BASE_HOST_NAME:-$HOSTNAME}
      VIKUNJA_SERVICE_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-16-byte-hex-string}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: vikunja-db
      VIKUNJA_DATABASE_DATABASE: ${DB_CREATE_DATABASE_NAME:-vikunja}
      VIKUNJA_DATABASE_USER: ${DB_USER_NAME:-vikunja}
      VIKUNJA_DATABASE_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      VIKUNJA_MAILER_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      VIKUNJA_MAILER_PORT: ${EMAIL_SERVER_PORT:-587}
      VIKUNJA_MAILER_FROMEMAIL: ${EMAIL_SERVER_MAIL_FROM:-no-reply@${BASE_HOST_NAME:-$HOSTNAME}}
    volumes:
      - './volumes/data/vikunja:/app/vikunja/files:z'
    depends_on:
      vikunja-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3456/api/v1/info']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.vikunja-app.entrypoints=http'
      - 'traefik.http.routers.vikunja-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.vikunja-app.middlewares=vikunja-app-https-redirect'
      - 'traefik.http.middlewares.vikunja-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.vikunja-app-secure.entrypoints=https'
      - 'traefik.http.routers.vikunja-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.vikunja-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.vikunja-app-secure.service=vikunja-app'
      - 'traefik.http.services.vikunja-app.loadbalancer.server.port=3456'
    networks:
      - vikunja
      - traefik

  vikunja-db:
    image: postgres:latest
    container_name: vikunja-db
    hostname: vikunja-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: vikunja-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-vikunja}
      POSTGRES_USER: ${DB_USER_NAME:-vikunja}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/vikunja:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vikunja

networks:
  vikunja:
    name: vikunja
    external: false
  traefik:
    external: true
