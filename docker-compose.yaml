# nginx proxy address - http://172.17.0.1:3456

name: vikunja
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  vikunja:
    image: vikunja/vikunja:latest
    pull_policy: always
    container_name: vikunja-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - vikunja
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:3456:3456"
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: vikunja-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      VIKUNJA_SERVICE_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      VIKUNJA_SERVICE_PUBLICURL: http://${BASE_HOST_NAME:-$HOSTNAME}:3456
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: vikunja-db
      VIKUNJA_DATABASE_DATABASE: ${DB_CREATE_DATABASE_NAME:-vikunja}
      VIKUNJA_DATABASE_USER: ${DB_USER_NAME:-vikunja}
      VIKUNJA_DATABASE_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      VIKUNJA_MAILER_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      VIKUNJA_MAILER_PORT: ${EMAIL_SERVER_PORT:-587}
      VIKUNJA_MAILER_FROMEMAIL: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
    volumes:
      - ./volumes/data/vikunja:/app/vikunja/files
    depends_on:
      vikunja-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3456/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://vikunja-app:3456'
      - 'cloudflare.hostname=vikunja.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.vikunja-app.entrypoints=http'
      - 'traefik.http.routers.vikunja-app-secure.tls=true'
      - 'traefik.http.routers.vikunja-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.vikunja-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.vikunja-app.middlewares=vikunja-app-https-redirect'
      - 'traefik.http.routers.vikunja-app-secure.entrypoints=https'
      - 'traefik.http.routers.vikunja-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.vikunja-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.vikunja-app-secure.service=vikunja-app'
      - 'traefik.http.services.vikunja-app.loadbalancer.server.port=3456'

  vikunja-db:
    image: postgres:latest
    pull_policy: always
    container_name: vikunja-db
    restart: always
    logging: *default-logging
    networks:
      - vikunja
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: vikunja-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-vikunja}
      POSTGRES_USER: ${DB_USER_NAME:-vikunja}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/vikunja:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  vikunja:
    name: vikunja
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
